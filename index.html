<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azulejos · União e Justiça Nº 4232</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#14223f;--navy2:#1d3160;--gold:#c9a24a;--gold2:#e6c878;--cream:#f6f0e2;--ink:#1c2333;--muted:#6b7280;--line:#e3dccb;--red:#a33;}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#f3efe6}
  h1,h2,h3,.serif{font-family:Cinzel,Georgia,serif}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;padding:10px 12px;border:1px solid #cfc6b0;border-radius:8px;background:#fff;width:100%}
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  label{font-size:13px;font-weight:600;color:#3b4252;display:block;margin-bottom:5px}

  /* Login */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#22386b,#0c1529);z-index:50}
  .login-card{background:var(--cream);padding:36px 34px 30px;border-radius:16px;width:min(380px,92vw);text-align:center;border:2px solid var(--gold);box-shadow:0 20px 60px rgba(0,0,0,.45)}
  .login-card img{width:150px;height:150px;border-radius:50%}
  .login-card h1{font-size:22px;margin:12px 0 4px;color:var(--navy)}
  .login-card p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}

  /* Layout */
  header{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
  .hwrap{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .hwrap img{width:54px;height:54px;border-radius:50%;background:#fff}
  .htitle h1{margin:0;font-size:20px;letter-spacing:.5px}
  .htitle div{font-size:12px;color:var(--gold2);letter-spacing:2px}
  nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;color:#dfe5f2;padding:8px 14px;border-radius:8px}
  nav button:hover{background:rgba(255,255,255,.08)}
  nav button.active{border-color:var(--gold);color:var(--gold2)}
  main{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
  .card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line)}
  .btn{background:var(--navy);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-weight:600}
  .btn:hover{background:var(--navy2)}
  .btn.gold{background:var(--gold);color:var(--navy)}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid #cfc6b0}
  .btn.danger{background:#fff;color:var(--red);border:1px solid #e5b5b5}
  .btn.sm{padding:6px 10px;font-size:13px}
  .hidden{display:none!important}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .stat .v{font-size:24px;font-weight:700;font-family:Cinzel,Georgia,serif;color:var(--navy);margin-top:4px}

  /* Form */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
  .radio{display:flex;gap:10px}
  .radio label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #cfc6b0;border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:500;margin:0}
  .radio input{width:auto}
  .radio label:has(input:checked){border-color:var(--gold);background:#fbf5e6}
  .preview canvas{width:100%;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2)}

  /* Table */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{width:auto;flex:1;min-width:180px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;background:#f7f3ea;color:#3b4252;font-weight:600;padding:10px;border-bottom:2px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
  td{padding:10px;border-bottom:1px solid #eee7d8;vertical-align:middle}
  tr:hover td{background:#fcfaf4}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
  .tag.pf{background:#e6edf9;color:#1d3160}
  .tag.pj{background:#f6ecd2;color:#7a5a10}
  .actions{display:flex;gap:6px;white-space:nowrap}
  .empty{text-align:center;color:var(--muted);padding:40px}

  /* Wall */
  .wall{padding:28px;border-radius:10px;
    background-color:#d8cfbd;
    background-image:
      linear-gradient(180deg,rgba(255,255,255,.25),rgba(0,0,0,.12)),
      repeating-linear-gradient(0deg,transparent 0 58px,rgba(120,105,80,.25) 58px 60px),
      repeating-linear-gradient(90deg,transparent 0 118px,rgba(120,105,80,.18) 118px 120px);
    box-shadow:inset 0 0 60px rgba(0,0,0,.25)}
  .wall-head{text-align:center;margin-bottom:22px}
  .wall-head h2{margin:0;color:var(--navy);font-size:26px}
  .wall-head div{color:#5a4a2a;letter-spacing:3px;font-size:12px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tile{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.35);cursor:pointer;transition:transform .15s}
  .tile:hover{transform:scale(1.04);z-index:2}
  .tile img{width:100%;height:100%;display:block}
  .tile.free{background:linear-gradient(135deg,#efe7d4,#e2d7bf);cursor:default;display:flex;align-items:center;justify-content:center;color:#a8987a;font-family:Cinzel,serif;font-size:12px;letter-spacing:1px;border:6px solid #1c2b4d}
  .tile.free:hover{transform:none}
  .tile .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,34,63,.88);color:#fff;font-size:11px;padding:4px 6px;text-align:center;opacity:0;transition:.15s}
  .tile:hover .cap{opacity:1}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(8,14,28,.75);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal-box{background:#fff;border-radius:14px;padding:20px;max-width:620px;width:100%;max-height:95vh;overflow:auto}
  .modal-box canvas{width:100%;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .modal-info{margin:14px 0;font-size:14px;color:#3b4252;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}
  .modal-info b{color:var(--ink)}
  .right{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

  @media (max-width:820px){.form-layout,.grid2{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
</style>
</head>

/* ---------- Dados ---------- */
let data = [];
let wallSize = 100;   // espaços na parede (fica salvo no banco)
const FIELDS = ['tipo','nome','loja','resp','azulejo','valor','data'];
const pick = r => Object.fromEntries(FIELDS.map(k => [k, r[k]]));
function dbErr(error){ if(error){ alert('Erro ao acessar o banco de dados:\n' + error.message); throw error; } }
async function loadData(){
  const [{data:rows,error},{data:cfg}] = await Promise.all([
    sb.from('azulejos').select('*').order('created_at'),
    sb.from('config').select('valor').eq('chave','tamanho_parede').maybeSingle()
  ]);
  dbErr(error);
  data = (rows||[]).map(r => ({...r, valor:Number(r.valor)}));
  if (cfg && +cfg.valor) wallSize = +cfg.valor;
  renderAll();
}
async function saveWallSize(n){
  const {error} = await sb.from('config').upsert({chave:'tamanho_parede', valor:String(n)});
  dbErr(error); wallSize = n;
}
let sort = {k:'data', dir:-1};
const $ = id => document.getElementById(id);
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtDate = s => s ? s.split('-').reverse().join('/') : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Login ---------- */
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); renderAll(); loadData(); }
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  if (!configured) { $('loginErr').textContent = 'Banco de dados ainda não configurado (veja o LEIA-ME).'; return; }
  $('loginErr').textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim().toLowerCase(), password: $('pwd').value });
  if (error) { $('loginErr').textContent = 'E-mail ou senha incorretos.'; $('pwd').select(); }
  else { $('loginErr').textContent = ''; showApp(); }
};
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').classList.contains('hidden')) loadData(); });

/* ---------- Abas ---------- */
document.querySelectorAll('nav button[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(t){
  document.querySelectorAll('nav button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab===t));
  ['cadastro','lista','parede'].forEach(x => $('tab-'+x).classList.toggle('hidden', x!==t));
  if (t==='parede') renderWall();
}

/* ---------- Desenho do azulejo ---------- */
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function goldGrad(c,x0,y0,x1,y1){const g=c.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'#b8862f');g.addColorStop(.5,'#f0d488');g.addColorStop(1,'#a87a25');return g;}

function column(c,x,y,w,h){
  const g=c.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,'#bdb6a8');g.addColorStop(.35,'#f4f1ea');g.addColorStop(1,'#a59e90');
  c.fillStyle=g;c.strokeStyle='#8d8676';c.lineWidth=1.5;
  // capitel
  c.fillRect(x-14,y,w+28,14);c.strokeRect(x-14,y,w+28,14);
  c.beginPath();c.ellipse(x-6,y+26,14,12,0,0,Math.PI*2);c.fill();c.stroke();
  c.beginPath();c.ellipse(x+w+6,y+26,14,12,0,0,Math.PI*2);c.fill();c.stroke();
  c.fillRect(x-4,y+14,w+8,30);c.strokeRect(x-4,y+14,w+8,30);
  // fuste
  c.fillRect(x,y+44,w,h-44-60);c.strokeRect(x,y+44,w,h-44-60);
  c.strokeStyle='rgba(120,112,98,.55)';
  for(let i=1;i<6;i++){c.beginPath();c.moveTo(x+i*w/6,y+48);c.lineTo(x+i*w/6,y+h-64);c.stroke();}
  // base / degraus
  c.strokeStyle='#8d8676';c.fillStyle=g;
  [[-6,16],[-14,18],[-24,22]].forEach(([d,hh],i)=>{const yy=y+h-60+[0,16,34][i];c.fillRect(x+d,yy,w-2*d,hh);c.strokeRect(x+d,yy,w-2*d,hh);});
}

function squareCompass(c,cx,cy,s,color){
  c.save();c.strokeStyle=color;c.fillStyle=color;c.lineWidth=s*.07;c.lineCap='round';
  // compasso
  c.beginPath();c.moveTo(cx,cy-s*.55);c.lineTo(cx-s*.45,cy+s*.45);c.moveTo(cx,cy-s*.55);c.lineTo(cx+s*.45,cy+s*.45);c.stroke();
  c.beginPath();c.arc(cx,cy-s*.55,s*.08,0,Math.PI*2);c.fill();
  // esquadro
  c.beginPath();c.moveTo(cx-s*.5,cy+s*.05);c.lineTo(cx,cy+s*.5);c.lineTo(cx+s*.5,cy+s*.05);c.stroke();
  c.font=`700 ${s*.32}px Cinzel, Georgia, serif`;c.textAlign='center';c.textBaseline='middle';c.fillText('G',cx,cy+s*.1);
  c.restore();
}

function corner(c,cx,cy,r,kind){
  c.save();
  c.fillStyle='#14223f';c.strokeStyle=goldGrad(c,cx-r,cy-r,cx+r,cy+r);c.lineWidth=5;
  if(kind==='sun'||kind==='moon'){c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();c.stroke();}
  else{c.beginPath();c.moveTo(cx,cy-r);c.lineTo(cx+r,cy);c.lineTo(cx,cy+r);c.lineTo(cx-r,cy);c.closePath();c.fill();c.stroke();}
  c.fillStyle=goldGrad(c,cx-r,cy-r,cx+r,cy+r);c.strokeStyle=c.fillStyle;c.lineWidth=4;c.lineCap='round';
  if(kind==='sun'){
    c.beginPath();c.arc(cx,cy,r*.38,0,Math.PI*2);c.fill();
    for(let i=0;i<12;i++){const a=i*Math.PI/6;c.beginPath();c.moveTo(cx+Math.cos(a)*r*.5,cy+Math.sin(a)*r*.5);c.lineTo(cx+Math.cos(a)*r*.75,cy+Math.sin(a)*r*.75);c.stroke();}
  } else if(kind==='moon'){
    c.beginPath();c.arc(cx+4,cy+2,r*.45,0,Math.PI*2);c.fill();
    c.fillStyle='#14223f';c.beginPath();c.arc(cx+r*.22,cy-r*.12,r*.42,0,Math.PI*2);c.fill();
    c.fillStyle='#f0d488';[[-.45,-.45],[.45,.4],[-.1,.55],[.5,-.5]].forEach(([dx,dy])=>{c.beginPath();c.arc(cx+dx*r,cy+dy*r,2.5,0,Math.PI*2);c.fill();});
  } else if(kind==='trowel'){
    c.beginPath();c.moveTo(cx-r*.35,cy+r*.35);c.lineTo(cx+r*.1,cy-r*.1);c.stroke();
    c.beginPath();c.moveTo(cx+r*.05,cy-r*.05);c.lineTo(cx+r*.45,cy-r*.45);c.lineTo(cx+r*.25,cy+r*.05);c.closePath();c.fill();
  } else {
    c.beginPath();c.moveTo(cx-r*.38,cy-r*.38);c.lineTo(cx+r*.38,cy+r*.38);c.moveTo(cx+r*.38,cy-r*.38);c.lineTo(cx-r*.38,cy+r*.38);c.stroke();
    c.fillRect(cx-r*.5,cy-r*.5,r*.25,r*.12);c.fillRect(cx+r*.25,cy-r*.5,r*.25,r*.12);
  }
  c.restore();
}

function fitText(c,text,maxW,startSize,weight,family){
  let s=startSize;do{c.font=`${weight} ${s}px ${family}`;s-=2;}while(c.measureText(text).width>maxW&&s>14);return s+2;
}
function splitName(c,name,maxW,size){
  c.font=`900 ${size}px Cinzel, Georgia, serif`;
  if(c.measureText(name).width<=maxW) return [name];
  const w=name.split(' ');if(w.length<2) return [name];
  let best=[name],bestDiff=1e9;
  for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(' '),b=w.slice(i).join(' ');const d=Math.max(c.measureText(a).width,c.measureText(b).width);if(d<bestDiff){bestDiff=d;best=[a,b];}}
  return best;
}

function drawTile(canvas, rec){
  const c=canvas.getContext('2d'),W=1000;
  c.clearRect(0,0,W,W);
  // moldura azul
  c.fillStyle='#14223f';c.fillRect(0,0,W,W);
  c.strokeStyle=goldGrad(c,0,0,W,W);c.lineWidth=4;c.strokeRect(16,16,W-32,W-32);
  // fundo creme
  const bg=c.createRadialGradient(W/2,W/2,100,W/2,W/2,620);bg.addColorStop(0,'#fbf7ec');bg.addColorStop(1,'#e8dcc0');
  roundRect(c,38,38,W-76,W-76,26);c.fillStyle=bg;c.fill();
  c.lineWidth=3;c.strokeStyle=goldGrad(c,0,0,W,W);roundRect(c,52,52,W-104,W-104,20);c.stroke();
  // colunas
  column(c,105,215,70,640);column(c,W-175,215,70,640);
  // cantos
  corner(c,118,118,52,'sun');corner(c,W-118,118,52,'moon');
  corner(c,128,W-128,58,'trowel');corner(c,W-128,W-128,58,'cross');
  // logotipo
  if(LOGO.complete&&LOGO.naturalWidth){c.save();c.globalCompositeOperation='multiply';c.drawImage(LOGO,W/2-190,70,380,380);c.restore();}
  // textos
  c.fillStyle='#1b2540';c.textAlign='center';c.textBaseline='alphabetic';
  c.font='600 25px Cinzel, Georgia, serif';
  ['ESTE AZULEJO REPRESENTA A FÉ, A UNIÃO','E O COMPROMISSO COM A CONSTRUÇÃO','DO NOSSO TEMPLO.'].forEach((t,i)=>c.fillText(t,W/2,488+i*34));
  const label = rec.tipo==='PJ' ? 'CONTRIBUIÇÃO DA EMPRESA' : 'CONTRIBUIÇÃO DO IRMÃO';
  c.font='700 22px Cinzel, Georgia, serif';c.fillText(label,W/2,613);
  const lw=c.measureText(label).width/2+16;
  c.strokeStyle='#1b2540';c.lineWidth=2;
  c.beginPath();c.moveTo(W/2-lw-90,605);c.lineTo(W/2-lw,605);c.moveTo(W/2+lw,605);c.lineTo(W/2+lw+90,605);c.stroke();
  // placa do nome
  const px=240,py=632,pw=520,ph=110;
  c.fillStyle='#fffaf0';roundRect(c,px,py,pw,ph,14);c.fill();
  c.lineWidth=5;c.strokeStyle=goldGrad(c,px,py,px+pw,py+ph);roundRect(c,px,py,pw,ph,14);c.stroke();
  c.lineWidth=1.5;roundRect(c,px+9,py+9,pw-18,ph-18,9);c.stroke();
  const name=(rec.azulejo||'NOME NO AZULEJO').toUpperCase();
  c.fillStyle='#141c30';
  let size=fitText(c,name,pw-50,52,'900','Cinzel, Georgia, serif');
  if(size<36){const lines=splitName(c,name,pw-50,40);if(lines.length===2){const s2=Math.min(fitText(c,lines[0],pw-50,40,'900','Cinzel, Georgia, serif'),fitText(c,lines[1],pw-50,40,'900','Cinzel, Georgia, serif'));c.font=`900 ${s2}px Cinzel, Georgia, serif`;c.fillText(lines[0],W/2,py+ph/2-4);c.fillText(lines[1],W/2,py+ph/2+s2-2);size=0;}}
  if(size){c.font=`900 ${size}px Cinzel, Georgia, serif`;c.textBaseline='middle';c.fillText(name,W/2,py+ph/2+3);c.textBaseline='alphabetic';}
  // rodapé
  squareCompass(c,W/2,800,78,'#b08a35');
  c.fillStyle='#1b2540';c.font='700 21px Cinzel, Georgia, serif';c.fillText('OR. CORONEL FABRICIANO/MG',W/2,880);
  const year=(rec.data||new Date().toISOString()).slice(0,4);
  c.font='900 30px Cinzel, Georgia, serif';c.fillText(year,W/2,922);
  c.strokeStyle='#1b2540';c.lineWidth=2;c.beginPath();c.moveTo(W/2-120,912);c.lineTo(W/2-50,912);c.moveTo(W/2+50,912);c.lineTo(W/2+120,912);c.stroke();
}

/* ---------- Formulário ---------- */
const form=$('saleForm');
const today=()=>new Date().toISOString().slice(0,10);
$('f-data').value=today();
const formRec=()=>({tipo:form.tipo.value,nome:$('f-nome').value.trim(),loja:$('f-loja').value.trim(),resp:$('f-resp').value.trim(),azulejo:$('f-azulejo').value.trim(),valor:parseFloat($('f-valor').value)||0,data:$('f-data').value});
function refreshPreview(){drawTile($('previewCanvas'),formRec());$('lblNome').textContent=form.tipo.value==='PJ'?'Razão social / Nome da empresa':'Nome completo';}
form.addEventListener('input',refreshPreview);
form.addEventListener('change',refreshPreview);
$('f-nome').addEventListener('blur',()=>{if(!$('f-azulejo').value)$('f-azulejo').value=$('f-nome').value.trim();refreshPreview();});

form.onsubmit=async e=>{
  e.preventDefault();
  const rec=formRec(),id=$('f-id').value;
  $('saveBtn').disabled=true;
  try{
    const {error}=id?await sb.from('azulejos').update(rec).eq('id',id):await sb.from('azulejos').insert(rec);
    dbErr(error);
    resetForm();await loadData();
    if(data.length>=wallSize) await saveWallSize(data.length+50);
    alert(id?'Venda atualizada!':'Venda registrada!');
  }finally{$('saveBtn').disabled=false;}
};
function resetForm(){form.reset();$('f-id').value='';$('f-valor').value=300;$('f-data').value=today();$('formTitle').textContent='Nova venda';$('saveBtn').textContent='Salvar venda';$('cancelEdit').classList.add('hidden');refreshPreview();}
$('cancelEdit').onclick=resetForm;
function editRec(id){
  const r=data.find(d=>d.id===id);if(!r)return;
  $('f-id').value=r.id;form.tipo.value=r.tipo;$('f-nome').value=r.nome;$('f-loja').value=r.loja;$('f-resp').value=r.resp;$('f-azulejo').value=r.azulejo;$('f-valor').value=r.valor;$('f-data').value=r.data;
  $('formTitle').textContent='Editar venda';$('saveBtn').textContent='Salvar alterações';$('cancelEdit').classList.remove('hidden');
  refreshPreview();showTab('cadastro');window.scrollTo({top:0,behavior:'smooth'});
}
async function delRec(id){const r=data.find(d=>d.id===id);if(r&&confirm(`Excluir a venda de "${r.nome}"?`)){const {error}=await sb.from('azulejos').delete().eq('id',id);dbErr(error);await loadData();}}

/* ---------- Lista ---------- */
function filtered(){
  const q=$('search').value.toLowerCase(),t=$('filterTipo').value,rp=$('filterResp').value;
  return data.filter(d=>(!t||d.tipo===t)&&(!rp||d.resp===rp)&&(!q||[d.nome,d.loja,d.azulejo,d.resp].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>{const x=a[sort.k],y=b[sort.k];return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'pt-BR'))*sort.dir;});
}
function renderTable(){
  const rows=filtered();
  $('tbody').innerHTML=rows.length?rows.map(d=>`<tr>
    <td><b>${esc(d.nome)}</b></td><td><span class="tag ${d.tipo.toLowerCase()}">${d.tipo==='PF'?'Física':'Jurídica'}</span></td>
    <td>${esc(d.loja)}</td><td>${esc(d.azulejo)}</td><td>${brl(d.valor)}</td><td>${esc(d.resp)}</td><td>${fmtDate(d.data)}</td>
    <td><div class="actions"><button class="btn gold sm" onclick="openTile('${d.id}')">Azulejo</button><button class="btn ghost sm" onclick="editRec('${d.id}')">Editar</button><button class="btn danger sm" onclick="delRec('${d.id}')">Excluir</button></div></td>
  </tr>`).join(''):`<tr><td colspan="8" class="empty">Nenhuma venda encontrada.</td></tr>`;
}
document.querySelectorAll('th[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;sort=sort.k===k?{k,dir:-sort.dir}:{k,dir:1};renderTable();});
['search','filterTipo','filterResp'].forEach(id=>$(id).addEventListener('input',renderTable));

function renderStats(){
  const total=data.reduce((s,d)=>s+(+d.valor||0),0),pf=data.filter(d=>d.tipo==='PF').length;
  $('stats').innerHTML=[['Azulejos vendidos',data.length],['Total arrecadado',brl(total)],['Pessoa Física',pf],['Pessoa Jurídica',data.length-pf]]
    .map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}
function renderResp(){
  const rs=[...new Set(data.map(d=>d.resp).filter(Boolean))].sort();
  $('respList').innerHTML=rs.map(r=>`<option value="${esc(r)}">`).join('');
  const cur=$('filterResp').value;
  $('filterResp').innerHTML='<option value="">Todos os responsáveis</option>'+rs.map(r=>`<option ${r===cur?'selected':''}>${esc(r)}</option>`).join('');
}

/* ---------- Parede ---------- */
const thumbCache={};
function thumb(d){
  const key=d.id+'|'+d.azulejo+'|'+d.tipo+'|'+d.data;
  if(!thumbCache[key]){const cv=document.createElement('canvas');cv.width=cv.height=1000;drawTile(cv,d);
    const sm=document.createElement('canvas');sm.width=sm.height=400;sm.getContext('2d').drawImage(cv,0,0,400,400);thumbCache[key]=sm.toDataURL('image/jpeg',.85);}
  return thumbCache[key];
}
function renderWall(){
  const list=[...data].sort((a,b)=>(a.data+a.id).localeCompare(b.data+b.id));
  let html=list.map(d=>`<div class="tile" onclick="openTile('${d.id}')" title="${esc(d.nome)}"><img src="${thumb(d)}" alt="${esc(d.azulejo)}"><div class="cap">${esc(d.nome)}</div></div>`).join('');
  const total=Math.max(wallSize,list.length);
  for(let i=list.length;i<total;i++)html+=`<div class="tile free">disponível</div>`;
  $('tiles').innerHTML=html;
  const pct=Math.round(list.length/total*100);
  $('wallInfo').innerHTML=`<b>${list.length}</b> de <b>${total}</b> espaços ocupados (${pct}%) · <b>${total-list.length}</b> disponíveis`;
}
$('growWall').onclick=async()=>{
  const n=parseInt(prompt(`A parede tem ${Math.max(wallSize,data.length)} espaços.\nQuantos espaços deseja adicionar?`,'50'),10);
  if(!n||n<1)return;
  await saveWallSize(Math.max(wallSize,data.length)+n);renderWall();
};
window.addEventListener('resize',()=>{if(!$('tab-parede').classList.contains('hidden'))renderWall();});

/* ---------- Modal ---------- */
let current=null;
function openTile(id){
  current=data.find(d=>d.id===id);if(!current)return;
  drawTile($('modalCanvas'),current);
  $('modalInfo').innerHTML=`<div>Nome: <b>${esc(current.nome)}</b></div><div>Tipo: <b>${current.tipo==='PF'?'Pessoa Física':'Pessoa Jurídica'}</b></div>
    <div>Loja: <b>${esc(current.loja)||'—'}</b></div><div>Valor: <b>${brl(current.valor)}</b></div>
    <div>Responsável: <b>${esc(current.resp)}</b></div><div>Data: <b>${fmtDate(current.data)}</b></div>`;
  $('modal').classList.remove('hidden');
}
$('closeModal').onclick=()=>$('modal').classList.add('hidden');
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.add('hidden');};
$('downloadTile').onclick=()=>{const a=document.createElement('a');a.download=`azulejo-${current.azulejo.replace(/[^\wÀ-ÿ]+/g,'-')}.png`;a.href=$('modalCanvas').toDataURL('image/png');a.click();};

/* ---------- Exportar / Backup ---------- */
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();}
$('exportCsv').onclick=()=>{
  const h=['Nome','Tipo','Loja','Nome no azulejo','Valor','Responsável','Data'];
  const rows=filtered().map(d=>[d.nome,d.tipo==='PF'?'Pessoa Física':'Pessoa Jurídica',d.loja,d.azulejo,String(d.valor).replace('.',','),d.resp,fmtDate(d.data)]);
  download('azulejos-uniao-e-justica.csv','﻿'+[h,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n'),'text/csv');
};
$('exportJson').onclick=()=>download(`backup-azulejos-${today()}.json`,JSON.stringify(data,null,2),'application/json');
$('importJson').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(async t=>{let arr;try{arr=JSON.parse(t);}catch{}
    if(!Array.isArray(arr))return alert('Arquivo de backup inválido.');
    const ids=new Set(data.map(d=>d.id)),novos=arr.filter(r=>!ids.has(r.id)).map(pick);
    if(!novos.length)return alert('Todas as vendas desse backup já estão no sistema.');
    if(confirm(`Adicionar ${novos.length} vendas do backup que ainda não estão no sistema?`)){const {error}=await sb.from('azulejos').insert(novos);dbErr(error);await loadData();}
  });e.target.value='';
};

function renderAll(){renderStats();renderResp();renderTable();refreshPreview();if(!$('tab-parede').classList.contains('hidden'))renderWall();}
LOGO.onload=()=>{for(const k in thumbCache)delete thumbCache[k];renderAll();};
if (configured) sb.auth.getSession().then(({data:{session}}) => { if (session) showApp(); });
else $('loginErr').textContent = 'Banco de dados ainda não configurado (veja o LEIA-ME).';
document.fonts&&document.fonts.ready.then(()=>{for(const k in thumbCache)delete thumbCache[k];renderAll();});
</script>
